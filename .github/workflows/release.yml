name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build executable
        run: >
          pyinstaller --onefile --windowed --name ClaudeObserver --clean
          --hidden-import=webview
          --hidden-import=webview.platforms.edgechromium
          --hidden-import=webview.platforms.winforms
          --hidden-import=webview.platforms.mshtml
          observer.py

      - name: Package release bundle
        run: |
          New-Item -ItemType Directory -Path release\ClaudeObserver | Out-Null
          Copy-Item dist\ClaudeObserver.exe release\ClaudeObserver\
          Copy-Item hooks release\ClaudeObserver\hooks -Recurse
          Copy-Item README.md release\ClaudeObserver\
          Compress-Archive -Path release\ClaudeObserver\* -DestinationPath ClaudeObserver-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ClaudeObserver.exe
            ClaudeObserver-${{ github.ref_name }}.zip
          generate_release_notes: true
